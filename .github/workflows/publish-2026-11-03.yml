name: Publish LCX 2026-11-03 release
on:
  push:
    branches: [main]
    paths:
      - docs/releases/2026-11-03.md
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: living-continuity-x-v2026.11.03
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'sign-out/Living-Continuity-X'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and installable runtime separation
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2026.11.03 >/dev/null 2>&1; then
            echo "Release v2026.11.03 already exists"
            exit 0
          fi
          gh release create v2026.11.03 \
            LCX.json \
            exports/LCX_Voyage_2026-11-03.json \
            --target "$GITHUB_SHA" \
            --title "Living Continuity X — Voyage sync 2026-11-03" \
            --notes-file docs/releases/2026-11-03.md
